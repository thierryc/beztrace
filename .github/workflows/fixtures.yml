name: Reference and standalone Swift tool

on:
  push:
    branches: [main, lit/initial-swift-port]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable reference checkpoint
        run: |
          python3 scripts/verify_fixtures.py
          python3 scripts/verify_milestone5.py
          python3 scripts/verify_oracle.py
          python3 scripts/verify_repository.py
          python3 scripts/check_reference_ufo.py Tests/Fixtures/oracle/v1/reference-source/VirtuaGrotesk-Regular.ufo
      - name: Verify maintenance tooling
        run: |
          test -x scripts/generate_deterministic_fixtures.py
          test -x scripts/capture_img2bez_oracle.sh
          test -x scripts/sanitize_oracle_logs.py
          test -x scripts/generate_malformed_corpus.py
          test -x scripts/promote_generated_fixtures.py
          test -x scripts/trace_generated_review.py
          test -x scripts/trace_corpus_review.py
          test -x scripts/verify_cross_arch_corpus.py
          test -x scripts/run_viability_tests.py
          test -x scripts/verify_packaged_workflow.py
          test -x scripts/verify_installed_package.py
          test -x scripts/verify_product_boundaries.py
          test -x scripts/verify_viability.py
          test -x scripts/build_release_candidate.sh
          python3 -m py_compile scripts/*.py
          python3 scripts/trace_generated_review_test.py
          python3 scripts/trace_corpus_review_test.py
          python3 scripts/verify_packaged_workflow_test.py
          python3 scripts/verify_installed_package_test.py
          python3 scripts/run_viability_tests_test.py
          python3 scripts/verify_product_boundaries.py
          python3 scripts/verify_viability_test.py
          python3 scripts/release_metadata_test.py
          bash -n scripts/capture_img2bez_oracle.sh
          bash -n scripts/build_release_candidate.sh
          bash -n release/package-scripts/preinstall
          python3 scripts/generate_deterministic_fixtures.py --check
          python3 scripts/generate_malformed_corpus.py --check
          python3 scripts/promote_generated_fixtures.py --check
          python3 scripts/sanitize_oracle_logs.py Tests/Fixtures/oracle/v1/structural \
            --img2bez-work test-work/img2bez-reference/img2bez/eval-harness/work \
            --reference-ufo Tests/Fixtures/oracle/v1/reference-source/VirtuaGrotesk-Regular.ufo \
            --check
      - name: Confirm checks are read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  sanitizer-smoke:
    name: AddressSanitizer malformed-input smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run committed mutation corpus under ASan
        run: >-
          swift test --configuration release --disable-swift-testing
          --sanitize=address --filter MalformedCorpusTests

  universal-unsigned:
    name: Universal unsigned final-release staging
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify unsigned universal candidate
        env:
          BEZTRACE_EXTERNAL_WORK: /private/tmp/beztrace-milestone-7-ci
        run: scripts/build_release_candidate.sh --final
      - name: Confirm repository remains read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  swift-standalone:
    name: Standalone Swift tool (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Record Swift environment
        run: |
          swift --version
          uname -m
      - name: Run pipeline, public contract, and command tests
        run: swift test --configuration release --disable-swift-testing
      - name: Build optimized library and executable
        run: swift build --configuration release
      - name: Smoke-test executable
        run: swift run --configuration release beztrace --version
      - name: Confirm checks are read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
